    </nav>

  <section class="contact contact-page">
    <h2>Бидэнтэй холбогдох</h2>
    <form action="#" method="post">
      <label for="name">Нэр</label>
      <input type="text" id="name" name="name" required>
      <label for="email">Имэйл</label>
      <input type="email" id="email" name="email" required>
      <label for="topic">Сэдэв</label>
      <select id="topic" name="topic">
        <option>Санал хүсэлт</option>
        <option>Захиалга</option>
        <option>Гомдол</option>
      </select>
      <label for="message">Зурвас</label>
      <textarea id="message" name="message" rows="5" required></textarea>
      <button type="submit" class="btn">Илгээх</button>
    </form>
  </section>

  <footer>
